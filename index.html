<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Kho & S-Invoice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden">
        
        <!-- Header & Chọn NNT -->
        <div class="bg-blue-700 text-white p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold flex items-center">
                <span class="mr-3">📦</span> Hệ thống Kho & S-Invoice (Bản Chính Thức)
            </h1>
            
            <div class="flex items-center bg-blue-800 p-2 rounded-lg">
                <label class="font-semibold mr-3 text-blue-200">Đơn vị (NNT):</label>
                <select id="nnt-select" onchange="changeNNT()" class="text-slate-800 bg-white font-bold p-2 rounded outline-none min-w-[280px]">
                    <!-- Danh sách NNT sẽ được tự động chèn vào đây -->
                </select>
            </div>
        </div>

        <!-- Menu Tabs -->
        <div class="flex border-b border-slate-200 bg-slate-50">
            <button onclick="switchTab('export-tab')" id="btn-export-tab" class="flex-1 py-4 font-bold text-blue-700 border-b-4 border-blue-700 bg-white transition">
                📤 XUẤT HÓA ĐƠN & TRỪ KHO
            </button>
            <button onclick="switchTab('import-tab')" id="btn-import-tab" class="flex-1 py-4 font-bold text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 transition border-b-4 border-transparent">
                📥 NHẬP KHO & ĐIỀU CHỈNH GIÁ
            </button>
        </div>

        <div class="p-6">
            <!-- ================= TAB 1: XUẤT HÓA ĐƠN ================= -->
            <div id="export-tab" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- Cột 1: Danh sách Hàng Tồn Kho -->
                <div class="bg-blue-50/50 p-5 rounded-xl border border-blue-200 shadow-sm flex flex-col h-[650px]">
                    <h3 class="text-lg font-bold text-blue-800 mb-4 border-b border-blue-200 pb-2 flex justify-between">
                        <span>1. Kho Hàng (Kéo hoặc Click đúp)</span>
                        <span id="htk-count" class="text-sm bg-blue-200 text-blue-800 px-2 py-1 rounded-full">0</span>
                    </h3>
                    
                    <input type="text" id="search-htk" onkeyup="filterHTK()" placeholder="🔍 Tìm kiếm nhanh tên hàng hóa..." class="mb-4 p-3 w-full border border-blue-300 rounded focus:ring-2 focus:ring-blue-500 outline-none font-medium shadow-inner">

                    <div id="htk-list" class="space-y-3 overflow-y-auto flex-1 pr-2">
                        <!-- Danh mục hàng hóa -->
                    </div>
                </div>

                <!-- Cột 2: Bàn làm việc Xuất Hóa Đơn -->
                <div class="bg-emerald-50/50 p-5 rounded-xl border border-emerald-200 shadow-sm flex flex-col h-[650px]">
                    <h3 class="text-lg font-bold text-emerald-800 mb-4 border-b border-emerald-200 pb-2 flex justify-between">
                        <span>2. Hóa đơn chờ xuất</span>
                        <button onclick="clearInvoice()" class="text-xs bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1 rounded font-bold transition shadow-sm">Làm mới hóa đơn</button>
                    </h3>
                    
                    <div id="invoice-items" class="space-y-3 flex-1 overflow-y-auto border-2 border-dashed border-emerald-300 p-3 rounded-lg bg-emerald-50/30">
                        <!-- Nơi thả mặt hàng -->
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-emerald-300">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-lg font-bold text-slate-700">Tổng Tiền Hàng:</span>
                            <span id="total-amount" class="text-2xl font-black text-red-600">0 VNĐ</span>
                        </div>
                        <button onclick="exportAndDeduct()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-6 rounded-lg shadow-lg transition flex justify-center items-center text-lg">
                            <span class="mr-2">✔️</span> CHỐT XUẤT HÓA ĐƠN & TRỪ KHO (EXCEL)
                        </button>
                    </div>
                </div>
            </div>

            <!-- ================= TAB 2: NHẬP KHO ================= -->
            <div id="import-tab" class="hidden">
                <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm mb-8">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                        <span class="bg-blue-600 text-white px-2 py-1 rounded-md mr-2 text-sm">+</span> Bổ sung hàng mới hoặc nhập thêm số lượng
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                        <div class="md:col-span-2">
                            <label class="text-xs font-bold text-slate-500 uppercase">Tên hàng hóa</label>
                            <input type="text" id="new-name" placeholder="VD: Ống nhựa Bình Minh..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase">Đơn vị tính</label>
                            <input type="text" id="new-unit" placeholder="kg, cái, hộp, cây..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase">SL Nhập</label>
                            <input type="number" id="new-qty" value="100" min="0" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase">Đơn giá bán</label>
                            <input type="number" id="new-price" value="0" min="0" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <button onclick="addNewItem()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition w-full md:w-auto">
                        Cập nhật vào kho
                    </button>
                </div>

                <!-- Bảng quản lý kho -->
                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-sm uppercase">
                                <th class="p-4 font-bold">Mã Hàng</th>
                                <th class="p-4 font-bold">Tên Hàng Hóa</th>
                                <th class="p-4 font-bold">ĐVT</th>
                                <th class="p-4 font-bold text-right">Tồn Kho</th>
                                <th class="p-4 font-bold text-right">Giá Cố Định</th>
                                <th class="p-4 font-bold text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body" class="text-slate-700">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

        let db = {};
        let currentNNT = "";

        // --- KHỞI TẠO HỆ THỐNG ---
        document.addEventListener("DOMContentLoaded", () => {
            // Đã đổi key lưu trữ thành v3 để ép nạp data thật mới nhất
            const savedDB = localStorage.getItem('invoice_db_v3');
            if (savedDB) {
                db = JSON.parse(savedDB);
            } else {
                db = defaultDB;
                saveDB();
            }

            const selectEl = document.getElementById('nnt-select');
            for (let key in db) {
                let option = document.createElement('option');
                option.value = key;
                option.text = db[key].name;
                selectEl.appendChild(option);
            }
            
            currentNNT = selectEl.value;
            renderHTK();
            renderImportTable();

            // Cấu hình Kéo Thả
            new Sortable(document.getElementById('htk-list'), {
                group: {
                    name: 'shared',
                    pull: 'clone', 
                    put: false
                },
                animation: 150,
                sort: false
            });

            new Sortable(document.getElementById('invoice-items'), {
                group: 'shared',
                animation: 150,
                onAdd: function (evt) {
                    let itemEl = evt.item;
                    let id = itemEl.getAttribute('data-id');
                    let itemData = db[currentNNT].inventory.find(i => i.id === id);

                    itemEl.innerHTML = `
                        <div class="w-full bg-white p-3 rounded shadow-sm border-l-4 border-emerald-500 relative">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-slate-800 item-name-val">${itemData.name}</span>
                                <button onclick="this.closest('.bg-white').parentElement.remove(); calculateTotal()" class="text-red-500 hover:text-red-700 text-sm font-bold bg-red-50 px-2 py-1 rounded">Xóa bỏ</button>
                            </div>
                            
                            <input type="hidden" class="item-id-val" value="${itemData.id}">
                            <input type="hidden" class="unit-input" value="${itemData.unit}">

                            <div class="grid grid-cols-3 gap-2 w-full mt-2">
                                <div>
                                    <label class="text-xs text-slate-500 font-bold">Tồn kho hiện tại</label>
                                    <div class="w-full p-2 bg-slate-100 rounded text-sm text-slate-600 font-mono">${itemData.qty} ${itemData.unit}</div>
                                </div>
                                <div>
                                    <label class="text-xs text-blue-600 font-bold">SL XUẤT</label>
                                    <input type="number" class="w-full p-2 border border-blue-300 rounded text-sm font-bold text-blue-700 qty-input focus:ring-2 focus:ring-blue-500" value="1" min="1" max="${itemData.qty}" step="any" onchange="calculateTotal()" onkeyup="calculateTotal()">
                                </div>
                                <div>
                                    <label class="text-xs text-slate-500 font-bold">Đơn giá bán</label>
                                    <input type="number" class="w-full p-2 border border-slate-300 rounded text-sm price-input focus:ring-2 focus:ring-blue-500" value="${itemData.price}" onchange="calculateTotal()" onkeyup="calculateTotal()">
                                </div>
                            </div>
                            <div class="mt-3 flex justify-between items-center">
                                 <div>
                                    <label class="text-xs text-slate-500 mr-2">Thuế GTGT:</label>
                                    <select class="p-1 border rounded text-xs vat-input bg-white outline-none focus:ring-2 focus:ring-emerald-500">
                                        <option value="8">8%</option>
                                        <option value="10">10%</option>
                                        <option value="5">5%</option>
                                        <option value="0">0%</option>
                                        <option value="-1">Không chịu thuế</option>
                                    </select>
                                 </div>
                                 <div class="text-right">
                                     <span class="text-xs text-slate-500 mr-2">Thành tiền:</span>
                                     <span class="font-bold text-red-600 text-lg total-text">0</span>
                                 </div>
                            </div>
                        </div>
                    `;
                    itemEl.className = "mb-3"; 
                    calculateTotal();
                }
            });
        });

        function saveDB() {
            localStorage.setItem('invoice_db_v3', JSON.stringify(db));
        }

        function changeNNT() {
            currentNNT = document.getElementById('nnt-select').value;
            document.getElementById('search-htk').value = ""; 
            clearInvoice();
            renderHTK();
            renderImportTable();
        }

        function switchTab(tabId) {
            document.getElementById('export-tab').classList.add('hidden');
            document.getElementById('import-tab').classList.add('hidden');
            document.getElementById(tabId).classList.remove('hidden');

            const btnExp = document.getElementById('btn-export-tab');
            const btnImp = document.getElementById('btn-import-tab');

            if(tabId === 'export-tab') {
                btnExp.className = "flex-1 py-4 font-bold text-blue-700 border-b-4 border-blue-700 bg-white transition";
                btnImp.className = "flex-1 py-4 font-bold text-slate-500 hover:text-emerald-600 hover:bg-emerald-50 transition border-b-4 border-transparent";
            } else {
                btnImp.className = "flex-1 py-4 font-bold text-emerald-600 border-b-4 border-emerald-600 bg-white transition";
                btnExp.className = "flex-1 py-4 font-bold text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition border-b-4 border-transparent";
            }
        }

        // Hỗ trợ Click đúp để chuyển hàng sang thay vì chỉ kéo thả
        function handleDoubleClick(id) {
            let itemData = db[currentNNT].inventory.find(i => i.id === id);
            if(itemData.qty <= 0) return;

            let invoiceContainer = document.getElementById('invoice-items');
            let itemEl = document.createElement('div');
            itemEl.className = "mb-3";
            itemEl.innerHTML = `
                <div class="w-full bg-white p-3 rounded shadow-sm border-l-4 border-emerald-500 relative">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-slate-800 item-name-val">${itemData.name}</span>
                        <button onclick="this.closest('.bg-white').parentElement.remove(); calculateTotal()" class="text-red-500 hover:text-red-700 text-sm font-bold bg-red-50 px-2 py-1 rounded">Xóa bỏ</button>
                    </div>
                    
                    <input type="hidden" class="item-id-val" value="${itemData.id}">
                    <input type="hidden" class="unit-input" value="${itemData.unit}">

                    <div class="grid grid-cols-3 gap-2 w-full mt-2">
                        <div>
                            <label class="text-xs text-slate-500 font-bold">Tồn kho hiện tại</label>
                            <div class="w-full p-2 bg-slate-100 rounded text-sm text-slate-600 font-mono">${itemData.qty} ${itemData.unit}</div>
                        </div>
                        <div>
                            <label class="text-xs text-blue-600 font-bold">SL XUẤT</label>
                            <input type="number" class="w-full p-2 border border-blue-300 rounded text-sm font-bold text-blue-700 qty-input focus:ring-2 focus:ring-blue-500" value="1" min="1" max="${itemData.qty}" step="any" onchange="calculateTotal()" onkeyup="calculateTotal()">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 font-bold">Đơn giá bán</label>
                            <input type="number" class="w-full p-2 border border-slate-300 rounded text-sm price-input focus:ring-2 focus:ring-blue-500" value="${itemData.price}" onchange="calculateTotal()" onkeyup="calculateTotal()">
                        </div>
                    </div>
                    <div class="mt-3 flex justify-between items-center">
                            <div>
                            <label class="text-xs text-slate-500 mr-2">Thuế GTGT:</label>
                            <select class="p-1 border rounded text-xs vat-input bg-white outline-none focus:ring-2 focus:ring-emerald-500">
                                <option value="8">8%</option>
                                <option value="10">10%</option>
                                <option value="5">5%</option>
                                <option value="0">0%</option>
                                <option value="-1">Không chịu thuế</option>
                            </select>
                            </div>
                            <div class="text-right">
                                <span class="text-xs text-slate-500 mr-2">Thành tiền:</span>
                                <span class="font-bold text-red-600 text-lg total-text">0</span>
                            </div>
                    </div>
                </div>
            `;
            invoiceContainer.appendChild(itemEl);
            calculateTotal();
        }

        function renderHTK(filterText = "") {
            const htkList = document.getElementById('htk-list');
            htkList.innerHTML = "";
            let inventory = db[currentNNT].inventory;
            let count = 0;

            inventory.forEach(item => {
                if(item.name.toLowerCase().includes(filterText.toLowerCase())) {
                    count++;
                    let div = document.createElement('div');
                    let canDrag = item.qty > 0 ? "cursor-grab hover:border-blue-500 hover:shadow-md" : "opacity-50 cursor-not-allowed bg-slate-100";
                    
                    div.className = `bg-white p-3 rounded shadow-sm border border-slate-200 transition flex justify-between items-center ${canDrag}`;
                    if(item.qty > 0) { 
                        div.setAttribute('data-id', item.id); 
                        div.ondblclick = () => handleDoubleClick(item.id); 
                    }

                    div.innerHTML = `
                        <div class="w-full flex items-center">
                            <span class="text-slate-400 mr-3 cursor-grab text-lg">⋮⋮</span>
                            <div class="w-full">
                                <p class="font-bold text-slate-800 text-sm truncate" title="${item.name}">${item.name}</p>
                                <div class="flex justify-between items-center mt-1">
                                    <span class="text-xs font-bold ${item.qty > 0 ? 'text-emerald-700 bg-emerald-100' : 'text-red-700 bg-red-100'} px-2 py-0.5 rounded shadow-sm">
                                        Tồn: ${item.qty.toLocaleString('vi-VN')} ${item.unit}
                                    </span>
                                    <span class="text-xs text-slate-500 font-semibold">Giá: ${item.price.toLocaleString('vi-VN')} đ</span>
                                </div>
                            </div>
                        </div>
                    `;
                    htkList.appendChild(div);
                }
            });
            document.getElementById('htk-count').innerText = count;
        }

        function filterHTK() {
            let text = document.getElementById('search-htk').value;
            renderHTK(text);
        }

        function clearInvoice() {
            document.getElementById('invoice-items').innerHTML = "";
            calculateTotal();
        }

        function calculateTotal() {
            let grandTotal = 0;
            const items = document.getElementById('invoice-items').querySelectorAll('.bg-white');
            items.forEach(item => {
                const qty = parseFloat(item.querySelector('.qty-input').value) || 0;
                const price = parseFloat(item.querySelector('.price-input').value) || 0;
                const lineTotal = qty * price;
                item.querySelector('.total-text').innerText = lineTotal.toLocaleString('vi-VN');
                grandTotal += lineTotal;
            });
            document.getElementById('total-amount').innerText = grandTotal.toLocaleString('vi-VN');
        }

        function renderImportTable() {
            const tbody = document.getElementById('inventory-table-body');
            tbody.innerHTML = "";
            let inventory = db[currentNNT].inventory;

            inventory.forEach(item => {
                let tr = document.createElement('tr');
                tr.className = "border-b border-slate-100 hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-4 text-sm font-mono text-slate-500">${item.id}</td>
                    <td class="p-4 font-semibold text-slate-800">${item.name}</td>
                    <td class="p-4 text-sm font-medium text-slate-600">${item.unit}</td>
                    <td class="p-4 font-bold text-right text-blue-700 bg-blue-50/30">${item.qty.toLocaleString('vi-VN')}</td>
                    <td class="p-4 text-right text-sm font-semibold">${item.price.toLocaleString('vi-VN')} đ</td>
                    <td class="p-4 text-center">
                        <button onclick="deleteItem('${item.id}')" class="text-red-500 hover:text-red-700 font-bold text-sm bg-red-50 hover:bg-red-100 px-3 py-1 rounded transition">Xóa</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addNewItem() {
            let name = document.getElementById('new-name').value.trim();
            let unit = document.getElementById('new-unit').value.trim();
            let qty = parseFloat(document.getElementById('new-qty').value) || 0;
            let price = parseFloat(document.getElementById('new-price').value) || 0;

            if(!name || !unit) {
                alert("Vui lòng điền đủ Tên hàng hóa và Đơn vị tính!");
                return;
            }

            let inventory = db[currentNNT].inventory;
            let existingItem = inventory.find(i => i.name.toLowerCase() === name.toLowerCase());

            if(existingItem) {
                existingItem.qty += qty;
                existingItem.price = price > 0 ? price : existingItem.price;
                alert(`Đã cộng thêm ${qty} ${unit} vào mặt hàng: ${name}\nTồn kho mới: ${existingItem.qty} ${unit}`);
            } else {
                let newId = "MH" + (inventory.length + 1).toString().padStart(3, '0');
                inventory.push({ id: newId, name: name, unit: unit, qty: qty, price: price });
                alert(`Đã tạo mới mặt hàng: ${name} vào kho!`);
            }

            saveDB();
            renderImportTable();
            renderHTK(document.getElementById('search-htk').value);
            
            document.getElementById('new-name').value = "";
            document.getElementById('new-unit').value = "";
            document.getElementById('new-qty').value = "100";
            document.getElementById('new-price').value = "0";
            document.getElementById('new-name').focus();
        }

        function deleteItem(id) {
            if(confirm("Bạn có chắc chắn muốn xóa vĩnh viễn mặt hàng này khỏi kho?")) {
                db[currentNNT].inventory = db[currentNNT].inventory.filter(i => i.id !== id);
                saveDB();
                renderImportTable();
                renderHTK(document.getElementById('search-htk').value);
            }
        }

        function exportAndDeduct() {
            const itemEls = document.getElementById('invoice-items').querySelectorAll('.bg-white');
            if(itemEls.length === 0) {
                alert("Bạn chưa chọn mặt hàng nào để xuất hóa đơn!");
                return;
            }

            let inventory = db[currentNNT].inventory;
            let errors = [];
            let itemsToExport = [];

            itemEls.forEach(el => {
                let id = el.querySelector('.item-id-val').value;
                let name = el.querySelector('.item-name-val').innerText;
                let sellQty = parseFloat(el.querySelector('.qty-input').value) || 0;
                let price = parseFloat(el.querySelector('.price-input').value) || 0;
                let unit = el.querySelector('.unit-input').value;
                let vatRate = parseFloat(el.querySelector('.vat-input').value); 
                
                let dbItem = inventory.find(i => i.id === id);
                
                if (sellQty <= 0) {
                    errors.push(`- [${name}]: Số lượng xuất không hợp lệ (phải > 0).`);
                } else if (sellQty > dbItem.qty) {
                    errors.push(`- [${name}]: Vượt quá hàng trong kho (Kho hiện tại chỉ có ${dbItem.qty} ${unit}).`);
                } else {
                    itemsToExport.push({ id, dbItem, name, unit, sellQty, price, vatRate });
                }
            });

            if(errors.length > 0) {
                alert("⚠️ PHÁT HIỆN LỖI KHI XUẤT HÓA ĐƠN:\n\n" + errors.join("\n") + "\n\nVui lòng chỉnh lại số lượng trước khi chốt xuất.");
                return;
            }

            let excelData = [[
                "Tên người mua", "Tên đơn vị", "Mã số thuế", "Địa chỉ", "Hình thức thanh toán", 
                "Loại tiền", "Mã hàng", "Tên hàng hóa, dịch vụ", "Đơn vị tính", "Số lượng", 
                "Đơn giá", "Thành tiền", "Thuế suất (%)", "Tiền thuế"
            ]];

            itemsToExport.forEach((item, index) => {
                let total = item.sellQty * item.price;
                let vatRateStr = item.vatRate === -1 ? -1 : item.vatRate; // -1 cho KCT
                let vatAmount = item.vatRate === -1 ? 0 : (total * item.vatRate) / 100;

                excelData.push([
                    "Khách lẻ không lấy hóa đơn", "", "", "", "TM/CK", "VND", 
                    item.id, item.name, item.unit, item.sellQty, item.price, total, vatRateStr, vatAmount 
                ]);

                // Trừ kho
                item.dbItem.qty -= item.sellQty;
            });

            saveDB();

            const ws = XLSX.utils.aoa_to_sheet(excelData);
            const wscols = [
                {wch: 25}, {wch: 15}, {wch: 15}, {wch: 15}, {wch: 18}, {wch: 10}, 
                {wch: 12}, {wch: 40}, {wch: 10}, {wch: 10}, {wch: 15}, {wch: 15}, 
                {wch: 12}, {wch: 15}
            ];
            ws['!cols'] = wscols;

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Import_SInvoice");
            
            let dateStr = new Date().toLocaleDateString('vi-VN').replace(/\//g, '-');
            XLSX.writeFile(wb, `DuLieuXuat_${db[currentNNT].mst}_${dateStr}.xlsx`);

            alert("✅ LẬP HÓA ĐƠN THÀNH CÔNG!\n- File Excel đã được tải về máy.\n- Hàng tồn kho đã được trừ tự động.");
            clearInvoice();
            renderHTK(document.getElementById('search-htk').value);
            renderImportTable();
        }
    </script>
</body>
</html>
